<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" fill="none" role="img" aria-label="This Dot Labs — Proven Partners That Deliver. The AI Gap Isn't Infra. It's Enablement.">
  <defs>
    <!-- Base dark background matching ai.thisdot.co (#000 / #0A0A0A) -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="55%" stop-color="#060606"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <!-- Electric-blue glow (#0055FF) -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0055FF" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#0055FF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0055FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0055FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#0055FF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0055FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dotGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#0055FF"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- Blue glows -->
  <ellipse cx="1050" cy="60" rx="420" ry="300" fill="url(#glow)"/>
  <ellipse cx="120" cy="300" rx="360" ry="240" fill="url(#glow)" opacity="0.6"/>

  <!-- Subtle grid texture -->
  <g stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1">
    <path d="M0 75 H1200 M0 150 H1200 M0 225 H1200"/>
    <path d="M150 0 V300 M300 0 V300 M450 0 V300 M600 0 V300 M750 0 V300 M900 0 V300 M1050 0 V300"/>
  </g>

  <!-- Wordmark: This Dot Labs -->
  <g transform="translate(80, 92)">
    <text x="0" y="0" font-family="Inter, 'DM Sans', Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#FFFFFF" letter-spacing="-0.5">This Dot Labs</text>
    <!-- The signature dot -->
    <circle cx="343" cy="-13" r="9" fill="url(#dotGrad)"/>
  </g>

  <!-- Accent divider -->
  <rect x="80" y="118" width="360" height="2" rx="1" fill="url(#accentLine)"/>

  <!-- Primary tagline -->
  <text x="80" y="168" font-family="Inter, 'DM Sans', Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#FFFFFF" letter-spacing="-0.5">Proven Partners That Deliver</text>

  <!-- AI hook -->
  <text x="80" y="212" font-family="Inter, 'DM Sans', Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#0055FF">The AI Gap Isn&#39;t Infra. It&#39;s Enablement.</text>

  <!-- Supporting line -->
  <text x="80" y="248" font-family="Inter, 'DM Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#999999">Building ambitious software &#8226; Adopting AI across the SDLC</text>
</svg>
